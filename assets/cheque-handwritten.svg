<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Handwritten bank cheque</title><desc id="desc">A pale blue security-pattern cheque with handwritten payee, amount, date, account number and signature.</desc>
<defs><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#8bb4f4" opacity=".36"/></pattern><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient></defs>
<rect x="3" y="3" width="894" height="514" rx="7" fill="url(#paper)" stroke="#c6d9fa" stroke-width="5"/>
<rect x="7" y="7" width="886" height="506" fill="url(#dots)"/>
<rect x="7" y="7" width="886" height="86" fill="#fff" opacity=".94"/>
<g fill="#173777" font-family="Arial,sans-serif"><path d="M63 48l15-16 15 16-7 0-8-8-8 8z"/><text x="111" y="53" font-size="27" font-weight="700" letter-spacing="4">BANK NAME</text><text x="660" y="37" font-size="13" letter-spacing="5">DATE</text></g>
<g stroke="#173777" stroke-width="1.8" fill="none"><rect x="672" y="13" width="190" height="35"/><path d="M695 13v35m23-35v35m23-35v35m23-35v35m23-35v35m23-35v35m23-35v35"/></g>
<g fill="#173777" font-family="Arial,sans-serif" font-size="11" font-weight="700"><text x="675" y="61" letter-spacing="4">D D M M Y Y Y Y</text><text x="60" y="129" font-size="15">PAY</text><text x="780" y="129" font-size="14">OR BEARER</text><text x="60" y="210" font-size="15">SUM OF</text><text x="60" y="355" font-size="14">ACC. NO.</text><text x="692" y="398" font-size="13">PLEASE SIGN ABOVE</text></g>
<g stroke="#173777" stroke-width="1.8" fill="none"><path d="M60 140H840M60 226H620M60 288H620"/><rect x="60" y="330" width="420" height="48"/><rect x="645" y="192" width="195" height="52"/><path d="M680 192v52M635 410h205"/></g>
<g fill="#143fba" font-family="cursive" font-style="italic"><text x="68" y="134" font-size="29">Northerner Ltd</text><text x="68" y="214" font-size="25">Two Thousand Four Hundred</text><text x="68" y="276" font-size="25">Eighty Only</text><text x="690" y="225" font-size="25">₹ 2,480.00</text><text x="95" y="362" font-size="26">123456789012</text><text x="680" y="389" font-size="31">Prabhu</text><text x="694" y="87" font-size="20">29 10 2026</text></g>
<rect x="60" y="446" width="780" height="47" fill="#fff" opacity=".86"/><g fill="#173777" font-family="monospace" font-size="20" letter-spacing="5"><text x="110" y="478">⑆ 567890⑆</text><text x="390" y="478">1234567890</text><text x="700" y="478">1234</text></g>
</svg>